name: VantaVoice CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: node --check server.js
      - run: timeout 10s npm start > /tmp/vantavoice.log 2>&1 &
        working-directory: server
      - run: sleep 2 && curl --fail http://127.0.0.1:3000/api/health
